name: radar

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run radar
        id: radar
        run: npm run radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit seen jobs
        if: always()
        shell: bash
        run: |
          if [ -z "$(git status --porcelain data/seen.json)" ]; then
            echo "data/seen.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git commit -m "chore: update seen jobs [skip ci]"
          (git pull --rebase && git push) || {
            echo "Push rejected; retrying once."
            git rebase --abort 2>/dev/null || true
            sleep 5
            git pull --rebase && git push
          }
